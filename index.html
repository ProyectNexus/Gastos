<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gastos</title>

<!-- Estos tags solo funcionan en la página de arriba. Por eso existe este archivo. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">

<script>
/*
 * iOS lee el estilo de la barra de estado UNA sola vez, al arrancar la app,
 * y ya no lo cambia. Por eso hay que escribir el meta correcto acá arriba,
 * antes de que termine de leer la página, según el tema que quedó guardado.
 *   claro  -> "default": barra clara, reloj negro
 *   oscuro -> "black":   barra negra,  reloj blanco
 */
(function () {
  var color = '#0F1319';
  try { color = localStorage.getItem('gastos.color') || color; } catch (e) {}

  var r = parseInt(color.substr(1, 2), 16),
      g = parseInt(color.substr(3, 2), 16),
      b = parseInt(color.substr(5, 2), 16);
  var claro = (0.299 * r + 0.587 * g + 0.114 * b) > 150;

  document.write('<meta name="apple-mobile-web-app-status-bar-style" content="' +
                 (claro ? 'default' : 'black') + '">');
  document.write('<meta name="theme-color" content="' + color + '">');
})();
</script>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  :root { --recorte: 0px; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0F1319; overscroll-behavior: none;
  }

  /* Si el cartel de Google llegara a aparecer, --recorte corre el marco
     hacia arriba lo justo para dejarlo afuera. En el celular casi nunca hace falta. */
  #marco {
    position: fixed;
    left: 0; right: 0;
    top: calc(0px - var(--recorte));
    height: calc(100% + var(--recorte));
    width: 100%;
    border: 0;
    display: block;
  }

  #cargando {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0F1319; z-index: 3; transition: opacity .4s ease;
  }
  #cargando.listo { opacity: 0; pointer-events: none; }
  .giro {
    width: 30px; height: 30px; border: 3px solid #E2E7DE;
    border-top-color: #2C7A54; border-radius: 50%;
    animation: girar .7s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="cargando"><div class="giro"></div></div>

<!-- PEGÁ ACÁ LA URL DE TU APLICACIÓN WEB (la que termina en /exec) -->
<iframe id="marco"
        src="https://script.google.com/macros/s/AKfycbzHrTTONfn13tX5LxdeUBxTV7myN_rmFbShDXA4UNwjXC4dEi1rJihcuMqKcoiGanEb7w/exec"
        allow="clipboard-write; vibrate"
        referrerpolicy="origin"></iframe>

<script>
  /**
   * El recorte se puede probar desde el celular agregando ?recorte=40 a la
   * dirección. Queda guardado, así que la app instalada lo recuerda.
   * Para volver atrás: ?recorte=0
   */
  (function () {
    var CLAVE = 'gastos.recorte';
    var pedido = new URLSearchParams(location.search).get('recorte');

    if (pedido !== null) {
      try { localStorage.setItem(CLAVE, String(parseInt(pedido, 10) || 0)); } catch (e) {}
    }

    var valor = 0;
    try { valor = parseInt(localStorage.getItem(CLAVE), 10) || 0; } catch (e) {}
    document.documentElement.style.setProperty('--recorte', valor + 'px');
  })();

  /**
   * La app avisa qué tema tiene puesto y el envoltorio se pinta igual.
   * Sin esto, detrás de la barra de estado se ve el fondo claro de esta
   * página y queda un corte con la app en tema oscuro.
   */
  (function () {
    var CLAVE_COLOR = 'gastos.color';

    function pintar(color) {
      if (!/^#[0-9A-Fa-f]{6}$/.test(String(color))) return;
      document.body.style.background = color;
      document.documentElement.style.background = color;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', color);
      document.getElementById('cargando').style.background = color;
    }

    // Antes de que cargue la app, usamos el último color conocido: sin parpadeo.
    try { pintar(localStorage.getItem(CLAVE_COLOR)); } catch (e) {}

    window.addEventListener('message', function (e) {
      if (!e.data || e.data.app !== 'gastos' || !e.data.color) return;
      if (String(e.origin).indexOf('googleusercontent.com') === -1 &&
          String(e.origin).indexOf('script.google.com') === -1) return;
      pintar(e.data.color);
      try { localStorage.setItem(CLAVE_COLOR, e.data.color); } catch (er) {}
    });
  })();

  document.getElementById('marco').addEventListener('load', function () {
    document.getElementById('cargando').classList.add('listo');
  });

  // Por si el marco tarda o falla, no dejamos la pantalla tapada.
  setTimeout(function () {
    document.getElementById('cargando').classList.add('listo');
  }, 6000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
